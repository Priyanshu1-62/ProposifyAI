name: Docker Build and Publish

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    runs-on: ubuntu-latest
  
    environment: production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PAT }}

    - name: Build And Push Client Image
      uses: docker/build-push-action@v6
      with:
        context: ./client
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/proposifyai-client:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
  
    - name: Build And Push Server Image
      uses: docker/build-push-action@v6
      with:
        context: ./services/api
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/proposifyai-server:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

# TODO: Add cache-from and cache-to properties in each Image building stage to use GitHub Cache Storage to cache Image Layers. 
